name: Build and deploy to GitHub Pages

# Publishes main and develop side by side:
#   <pages url>/main/index.yml
#   <pages url>/develop/index.yml
# A Pages artifact deploy replaces the whole site, so every deploy rebuilds both branches.

on:
  push:
    branches: [main, develop]
    paths:
      - 'scrapers/**'
      - 'build_site.sh'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scrapers/**'
      - 'build_site.sh'
      - '.github/workflows/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs one at a time, so a slower older run can't deploy over a newer one.
# PR runs never deploy and get their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: build_site.sh derives each package version from git log
          fetch-depth: '0'
          # On a PR, build the feature branch itself, not GitHub's merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build PR feature branch
        if: github.event_name == 'pull_request'
        run: ./build_site.sh "$GITHUB_WORKSPACE/_site/pr"

      - name: Build main and develop
        if: github.event_name != 'pull_request'
        run: |
          for branch in main develop; do
            git worktree add --detach "$RUNNER_TEMP/src-$branch" "origin/$branch"
            (cd "$RUNNER_TEMP/src-$branch" && ./build_site.sh "$GITHUB_WORKSPACE/_site/$branch")
          done

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ github.ref_name }}/index.yml
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
